<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YanzClean - HD Status Uploader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-700">
        <!-- Header -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-blue-400 tracking-wide">YanzClean</h1>
            <p class="text-xs text-gray-400 mt-1">HD Status WhatsApp Uploader</p>
        </div>

        <!-- Form Upload -->
        <form id="uploadForm" class="space-y-5">
            <!-- Input Nomor WhatsApp -->
            <div>
                <label class="block text-xs font-semibold uppercase text-gray-300 mb-2">Nomor WhatsApp</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400 text-sm">
                        <i class="fa-solid fa-phone"></i>
                    </span>
                    <input type="number" id="waNumber" required placeholder="628123456789"
                        class="w-full pl-9 pr-4 py-2.5 bg-slate-700/50 border border-slate-600 rounded-xl focus:outline-none focus:border-blue-500 text-sm text-white placeholder-gray-500 transition">
                </div>
                <p class="text-[10px] text-gray-400 mt-1">*Gunakan kode negara tanpa tanda + (Contoh: 628123456789)</p>
            </div>

            <!-- Input Video -->
            <div>
                <label class="block text-xs font-semibold uppercase text-gray-300 mb-2">Pilih File Video</label>
                <input type="file" id="videoFile" accept="video/*" required
                    class="w-full text-xs text-gray-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer bg-slate-700/50 border border-slate-600 rounded-xl transition">
            </div>

            <!-- Progress Bar -->
            <div id="progressContainer" class="hidden space-y-2">
                <div class="w-full bg-slate-700 rounded-full h-2">
                    <div id="progressBar" class="bg-blue-500 h-2 rounded-full w-0 transition-all duration-300"></div>
                </div>
                <p id="statusText" class="text-xs text-center text-gray-400">Mengirim video ke server...</p>
            </div>

            <!-- Tombol Submit -->
            <button type="submit" id="submitBtn"
                class="w-full py-3 bg-blue-600 hover:bg-blue-500 active:scale-95 rounded-xl font-semibold text-sm transition-all duration-200 flex items-center justify-center gap-2 shadow-lg shadow-blue-600/30">
                <i class="fa-solid fa-cloud-arrow-up"></i> Upload Video HD
            </button>
        </form>

        <!-- Status Alert -->
        <div id="alertBox" class="mt-4 p-3 rounded-xl text-xs font-medium hidden text-center"></div>

        <!-- Footer -->
        <div class="mt-6 text-center text-[11px] text-gray-500">
            Developer: <span class="text-blue-400 font-semibold">Yanz Storu</span>
        </div>
    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const waNumber = document.getElementById('waNumber').value.trim();
            const videoInput = document.getElementById('videoFile');
            const submitBtn = document.getElementById('submitBtn');
            const alertBox = document.getElementById('alertBox');
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            const statusText = document.getElementById('statusText');

            if (!videoInput.files[0]) {
                showAlert('Silakan pilih file video terlebih dahulu.', 'bg-red-500/20 text-red-400 border border-red-500/30');
                return;
            }

            const formData = new FormData();
            formData.append('video', videoInput.files[0]);
            formData.append('waNumber', waNumber);

            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
            progressContainer.classList.remove('hidden');
            progressBar.style.width = '50%';
            statusText.innerText = 'Mengunggah video ke server...';
            alertBox.classList.add('hidden');

            try {
                // Menggunakan relative path /api/upload karena sudah di-rewrite oleh vercel.json
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok && data.status === 'success') {
                    progressBar.style.width = '100%';
                    statusText.innerText = 'Selesai!';
                    showAlert('✅ Video berhasil dikirim! Bot sedang memproses ke HD dan akan dikirim ke grup.', 'bg-green-500/20 text-green-400 border border-green-500/30');
                    document.getElementById('uploadForm').reset();
                } else {
                    throw new Error(data.message || 'Gagal mengunggah video.');
                }
            } catch (error) {
                showAlert(`❌ Gagal: ${error.message}`, 'bg-red-500/20 text-red-400 border border-red-500/30');
            } finally {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                setTimeout(() => {
                    progressContainer.classList.add('hidden');
                    progressBar.style.width = '0%';
                }, 4000);
            }
        });

        function showAlert(message, bgClass) {
            const alertBox = document.getElementById('alertBox');
            alertBox.className = `mt-4 p-3 rounded-xl text-xs font-medium text-center ${bgClass}`;
            alertBox.innerText = message;
            alertBox.classList.remove('hidden');
        }
    </script>
</body>
</html>

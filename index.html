<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YanzClean - HD Video Sender</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col justify-center items-center p-4">

    <!-- Main Card -->
    <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-gray-700">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500">
                YanzClean
            </h1>
            <p class="text-gray-400 mt-2 text-sm">Kirim Video HD ke WhatsApp (Tanpa Kompresi)</p>
        </div>

        <form id="uploadForm" class="space-y-6">
            <!-- Input Nomor -->
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Nomor WhatsApp Tujuan</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fab fa-whatsapp"></i>
                    </span>
                    <input type="number" id="targetNumber" required placeholder="628123456789" 
                        class="w-full pl-10 pr-4 py-3 bg-gray-700 border border-gray-600 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all">
                </div>
            </div>

            <!-- Input File Video -->
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Pilih Video</label>
                <input type="file" id="videoFile" accept="video/*" required
                    class="w-full text-sm text-gray-400
                    file:mr-4 file:py-3 file:px-4
                    file:rounded-xl file:border-0
                    file:text-sm file:font-semibold
                    file:bg-blue-600 file:text-white
                    hover:file:bg-blue-700 file:cursor-pointer file:transition-all
                    bg-gray-700 border border-gray-600 rounded-xl">
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn" 
                class="w-full bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg transform transition hover:scale-105 flex justify-center items-center gap-2">
                <i class="fas fa-paper-plane"></i> Kirim Video
            </button>
        </form>

        <!-- Status Message -->
        <div id="statusMessage" class="hidden mt-4 text-center p-3 rounded-xl text-sm font-semibold"></div>
    </div>

    <!-- Footer -->
    <footer class="mt-8 text-center text-gray-500 text-sm">
        <p>Developer <span class="text-blue-400 font-semibold">Yanz Storu</span> &copy; 2026</p>
    </footer>

    <script>
        const form = document.getElementById('uploadForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusMessage = document.getElementById('statusMessage');

        // Menggunakan jalur lokal yang akan diarahkan otomatis oleh vercel.json
        const API_URL = '/api/send-video'; 

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const targetNumber = document.getElementById('targetNumber').value;
            const videoFile = document.getElementById('videoFile').files[0];

            if(!videoFile || !targetNumber) return;

            const formData = new FormData();
            formData.append('targetNumber', targetNumber);
            formData.append('video', videoFile);

            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mengirim...';
            submitBtn.disabled = true;
            statusMessage.classList.add('hidden');

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (response.ok) {
                    statusMessage.textContent = '✅ Berhasil! Video terkirim ke WhatsApp.';
                    statusMessage.className = 'mt-4 text-center p-3 rounded-xl text-sm font-semibold bg-green-500/20 text-green-400 border border-green-500/50 block';
                    form.reset();
                } else {
                    throw new Error(result.error || 'Gagal mengirim');
                }
            } catch (error) {
                statusMessage.textContent = '❌ Gagal: Pastikan bot Pterodactyl menyala.';
                statusMessage.className = 'mt-4 text-center p-3 rounded-xl text-sm font-semibold bg-red-500/20 text-red-400 border border-red-500/50 block';
            } finally {
                submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Kirim Video';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
